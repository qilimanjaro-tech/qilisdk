[project]
name = "qilisdk"
version = "0.2.2rc1"
description = "QiliSDK is a Python framework for writing digital and analog quantum algorithms and executing them across multiple quantum backends. Its modular design streamlines the development process and enables easy integration with a variety of quantum platforms."
readme = "README.md"
authors = [{name = "Qilimanjaro Quantum Tech", email = "info@qilimanjaro.tech"}]
requires-python = ">=3.11"
keywords = ["qilimanjaro", "quantum computing", "digital quantum computing", "analog quantum computing"]
urls = { "Homepage" = "https://github.com/qilimanjaro-tech/qilisdk", "Documentation" = "https://qilimanjaro-tech.github.io/qilisdk/", "Source" = "https://github.com/qilimanjaro-tech/qilisdk", "Issues" = "https://github.com/qilimanjaro-tech/qilisdk/issues", "Changelog" = "https://github.com/qilimanjaro-tech/qilisdk/blob/main/CHANGELOG.md" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Quantum Computing",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "dill>=0.3.9",
    "numpy>=2.3.2",
    "ruamel-yaml>=0.18.7",
    "scipy>=1.16.1",
    # 2.12 is the first release whose pinned pydantic-core has 3.14 wheels.
    "pydantic>=2.12.0",
    # Matches the CVE floor in tool.uv.constraint-dependencies below.
    "pydantic-settings>=2.14.2",
    "loguru>=0.7.3",
    "matplotlib>=3.10.5",
    "py-cpuinfo>=9.0.0",
    "rustworkx>=0.16.0",
    "psutil>=6.1.0",
    # Reads the optional backend requirements so a too-old CUDA-Q or QuTiP is reported clearly.
    "packaging>=24.2",
]

[project.optional-dependencies]
cuda = [
    "qilisdk[cuda12]"
]
# GPU support for QiliSim: CUDA math libraries (cuBLAS/cuSOLVER) loaded at runtime
# via dlopen by the QiliSim C++ shim. cusolver pulls in cusparse + nvjitlink.
cuda12 = [
    "nvidia-cuda-runtime-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cusolver-cu12",
    "nvidia-cusparse-cu12",
    "nvidia-nvjitlink-cu12",
]
cuda13 = [
    "nvidia-cuda-runtime",
    "nvidia-cublas",
    "nvidia-cusolver",
    "nvidia-cusparse",
    "nvidia-nvjitlink",
]
speqtrum = [
    "httpx==0.28.1",
    "keyring>=25.6.0",
    "keyrings-alt>=5.0.2",
]
openfermion = [
    "openfermion>=1.7.1",
]
qir = [
    # ptr_id, which the QIR importer needs, landed in 0.12.0.
    "pyqir>=0.12.0",
]
openqasm = [
    "openqasm3[parser]>=1.0.1",
]
scip = [
    # First release with cp314 wheels, older ones build SCIP from source there.
    "pyscipopt>=5.7.0",
]
all = [
    "qilisdk[cuda12]",
    "qilisdk[speqtrum]",
    "qilisdk[openfermion]",
    "qilisdk[qir]",
    "qilisdk[openqasm]",
    "qilisdk[scip]",
]
all-cu12 = [
    "qilisdk[cuda12]",
    "qilisdk[speqtrum]",
    "qilisdk[openfermion]",
    "qilisdk[qir]",
    "qilisdk[openqasm]",
    "qilisdk[scip]",
]
all-cu13 = [
    "qilisdk[cuda13]",
    "qilisdk[speqtrum]",
    "qilisdk[openfermion]",
    "qilisdk[qir]",
    "qilisdk[openqasm]",
    "qilisdk[scip]",
]

[dependency-groups]
# Optional backends we test against but do not distribute: CUDA-Q powers CudaqBackend
# and qutip powers QutipBackend, both installed by the user. These floors are mirrored
# in qilisdk.backends.OPTIONAL_FEATURES, which enforces them at runtime.
backends = [
    # CUDA-Q has no wheels for 3.14 yet, so CudaqBackend is untested there.
    "cuda-quantum-cu13>=0.14.0; python_version < '3.14'",
    "qutip>=5.2.2",
    "qutip-qip>=0.4.0",
]
dev = [
    "hypothesis>=6.152.4",
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.12",
    "towncrier>=25.8.0",
    "loguru-caplog>=0.2.0",
    "pytest-cov>=7.1.0",
    "gcovr>=8.6",
    "ty>=0.0.33",
    "diff-cover>=10.2.1",
]
docs = [
    "astroid<4.4",
    "nbsphinx>=0.9.7",
    "pypandoc-binary>=1.15",
    "sphinx==8.2.3",
    "sphinx-autoapi>=3.4.0",
    "sphinx-automodapi>=0.20.0",
    "sphinx-design>=0.7.0",
    "sphinx-mdinclude>=0.6.2",
    "sphinx-multiversion==0.2.4",
    "sphinxawesome-theme==6.0.5",
    "sphinx-intl",
    "sphinx-tabs>=3.5.0",
]

[tool.uv]
# openfermion 1.7.1 caps requests~=2.32.2; override until upstream loosens.
override-dependencies = ["nbconvert >= 7.17.0", "requests>=2.33.0"]
# Floor recurring transitive CVE offenders so a generic re-resolve cannot regress them.
constraint-dependencies = [
    "bleach>=6.4.0",              # W-26
    "cryptography>=48.0.1",       # high (W-26)
    "pydantic-settings>=2.14.2",  # W-26
    "tornado>=6.5.7",             # W-26
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
conflicts = [
    [
      { extra = "cuda12" },
      { extra = "cuda13" },
    ],
    [
      { extra = "cuda" },
      { extra = "cuda13" },
    ],
    [
      { extra = "all-cu12" },
      { extra = "all-cu13" },
    ],
    [
      { extra = "all" },
      { extra = "all-cu13" },
    ],
]

[tool.uv.sources]
sphinx-multiversion = { git = "https://github.com/sphinx-contrib/multiversion", branch = "main"}

[build-system]
requires = ["scikit-build-core", "pybind11>=2.13,<4"]
build-backend = "scikit_build_core.build"

[tool.scikit-build.sdist]
exclude = [
    "/.github",
    "/.hypothesis",
    "/.devcontainer",
    "/.vscode",
    "/.pytest_cache",
    "/.ruff_cache",
    "/dist",
    "/docs",
    "/changes",
    "/tests",
]

[tool.scikit-build]
cmake.args = ["-DCMAKE_VERBOSE_MAKEFILE:BOOL=ON"]
cmake.build-type = "Release"
editable.verbose = false

[[tool.scikit-build.overrides]]
if.platform-system = "^win32$"
inherit.cmake.args = "append"
cmake.args = ["-A", "x64"]

[tool.scikit-build.wheel]
packages = ["src/qilisdk"]

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} --no-dll qilisim_module*.pyd {wheel}"

[tool.ty.src]
include = ["src"]
exclude = ["tests"]

[tool.ruff]
line-length = 120
output-format = "concise"

[tool.ruff.lint]
preview = true
select = [
    "F",
    "E",
    "W",
    "I",
    "YTT",
    "ANN",
    "ASYNC",
    "S",
    "BLE",
    "CPY",
    "C4",
    "DTZ",
    "T10",
    "FA",
    "ICN",
    "LOG",
    "G",
    "INP",
    "PIE",
    "T20",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TC",
    "PTH",
    "TD",
    "PL",
    "NPY",
    "FURB",
    "DOC",
    "RUF"
]
ignore = [
    "suspicious-non-cryptographic-random-usage",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "line-too-long",
    "ambiguous-class-name",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "bad-quotes-inline-string",
    "bad-quotes-multiline-string",
    "bad-quotes-docstring",
    "avoidable-escaped-quote",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "single-line-implicit-string-concatenation",
    "multi-line-implicit-string-concatenation",
    "ambiguous-variable-name",
    "tab-indentation",
    "unnecessary-assign",
    "multiple-with-statements",
    "useless-import-alias",
    "import-private-name",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-many-positional-arguments",
    "too-many-nested-blocks",
    "missing-todo-link",
    "docstring-extraneous-exception",
    "non-empty-init-module"
]
dummy-variable-rgx = "^_$"
exclude = [".tmp", "docs/*"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "CPY", "private-member-access", "PLR", "DOC", "mutable-class-default", "float-equality-comparison"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-dummy-args = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.towncrier]
package = "qilisdk"
directory = "changes"
filename = "CHANGELOG.md"
issue_format = "[PR #{issue}](https://github.com/qilimanjaro-tech/qilisdk/pull/{issue})"
