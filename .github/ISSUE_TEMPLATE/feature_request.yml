name: Feature Request
description: Suggest a new feature or enhancement for QiliSDK
title: "[Feature]: "
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Keep it short. A one-line title like `Add <thing>` plus a code example of the API you want is enough.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: What to add, in a sentence or two.
      placeholder: One or two sentences describing the feature.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Use Case
      description: What you cannot do today, and why the workaround is not good enough.
      placeholder: I'm trying to do X, but currently I have to work around it by...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: |
        The API you want, as a code example. Add a note about any design decision the implementer has to settle.
      placeholder: |
        ```python
        # Example of desired usage
        import qilisdk
        ```
    validations:
      required: false
