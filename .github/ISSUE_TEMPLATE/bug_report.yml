name: Bug Report
description: Report a bug or unexpected behavior in QiliSDK
title: "[Bug]: "
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Keep it short. A one-line title like `<thing> ignores its <argument>` plus a snippet that fails is enough.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What is broken, in a sentence or two. Add the cause or a suggested fix if you know it.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: minimal_example
    attributes:
      label: Minimal Reproducible Example
      description: The shortest snippet that shows the problem.
      placeholder: |
        import qilisdk
        # Your minimal example here
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Paste the output, error message or traceback. No need to describe it in words.
      render: shell
    validations:
      required: true

  - type: textarea
    id: about
    attributes:
      label: System Information
      description: |
        Output of `print(qilisdk.about())`. If you are a maintainer on a dev checkout, the version and OS is enough.
      render: shell
    validations:
      required: true
