name: Publish

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform to publish the built distributions to"
        type: choice
        default: pypi
        options:
          - pypi
          - aws
      repository:
        description: "AWS CodeArtifact repository to publish to (only used when platform is aws)"
        type: string
        default: qilimanjaro
      dry_run:
        description: "Build and validate the distributions, but do not upload them"
        type: boolean
        default: false

# Never run two publishes for the same target at once, and never cancel one
# mid-upload (a partial upload to an index can be impossible to recover from).
concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  # Fails in seconds on a bad dispatch, instead of after the wheel builds.
  check-inputs:
    name: Check inputs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the repository input
        if: ${{ (inputs.platform || 'pypi') == 'aws' && !inputs.repository }}
        run: |
          echo "::error::Publishing to aws needs a CodeArtifact repository. Re-run with the repository input set."
          exit 1

  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check-inputs]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # PyPI gets the full platform set; CodeArtifact is Linux x86_64 only.
        os: ${{ fromJSON((inputs.platform || 'pypi') == 'pypi' && '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
      - name: Build wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e  # v4.3.5
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          CIBW_ARCHS_LINUX: ${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          # Import the repaired wheel, which is the artifact users get. Nothing
          # else in CI loads it, so this is where a bad delvewheel repair or a
          # broken rpath shows up. Cross-compiled macOS wheels cannot run here.
          CIBW_TEST_COMMAND: 'python -c "import qilisdk; from qilisdk.backends import QiliSim"'
          CIBW_TEST_SKIP: "*-macosx_x86_64"
        with:
          output-dir: dist
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: [check-inputs]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          python-version: "3.13"
      - name: Build sdist
        run: uv build --sdist
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  deploy-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    if: ${{ (inputs.platform || 'pypi') == 'pypi' }}
    environment:
      name: pypi
      url: https://pypi.org/p/qilisdk
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Download sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          python-version: "3.13"
      - name: List & validate distributions
        run: |
          ls -lh dist
          uvx twine check dist/*
      - name: Publish to PyPI
        run: >-
          uv publish
          --trusted-publishing always
          --check-url https://pypi.org/simple/qilisdk/
          ${{ inputs.dry_run && '--dry-run' || '' }}

  deploy-codeartifact:
    name: Publish to AWS CodeArtifact (${{ inputs.repository }})
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    if: ${{ (inputs.platform || 'pypi') == 'aws' }}
    env:
      AWS_REGION: eu-west-1
      CA_DOMAIN: qilimanjaro
      CA_DOMAIN_OWNER: "723412851021"
      CA_REPOSITORY: ${{ inputs.repository }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::723412851021:role/GitHub_actions_role
          aws-region: eu-west-1
          role-session-name: GitHubActions-DevOps
      - name: Assume deploy role in target account
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::723412851021:role/Code-Artifact-Publish
          aws-region: eu-west-1
          role-session-name: GitHubActions-Deploy
          role-chaining: true
          role-skip-session-tagging: true
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Download sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          python-version: "3.13"
      - name: List & validate distributions
        run: |
          ls -lh dist
          uvx twine check dist/*
      - name: Publish to CodeArtifact
        if: ${{ !inputs.dry_run }}
        run: |
          export TWINE_USERNAME=aws
          export TWINE_PASSWORD=$(aws codeartifact get-authorization-token \
            --domain "$CA_DOMAIN" \
            --domain-owner "$CA_DOMAIN_OWNER" \
            --query authorizationToken \
            --output text)
          export TWINE_REPOSITORY_URL=$(aws codeartifact get-repository-endpoint \
            --domain "$CA_DOMAIN" \
            --domain-owner "$CA_DOMAIN_OWNER" \
            --repository "$CA_REPOSITORY" \
            --format pypi \
            --query repositoryEndpoint \
            --output text)
          uvx twine upload dist/*

  # Once a release is on PyPI, open the PR that moves main to the next dev
  # version. Only X.Y.Z releases cut from main count: a post release, or a
  # release from a qilisdk-X.Y.Z line, leaves main alone.
  post-release:
    name: Open post-release PR
    runs-on: ubuntu-latest
    needs: [deploy-pypi]
    if: ${{ github.event_name == 'release' }}
    permissions: {}
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      # The PR comes from the backport App rather than GITHUB_TOKEN, because
      # a PR opened with GITHUB_TOKEN does not start the required checks.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.BACKPORT_CLIENT_ID }}
          private-key: ${{ secrets.BACKPORT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Bump main and open the PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::notice::$VERSION is not an X.Y.Z release, so main is left alone"
            exit 0
          fi
          dev="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1)).dev0"
          branch="postrelease/$VERSION"
          if ! grep -qx "version = \"$VERSION\"" pyproject.toml; then
            echo "::notice::main is not at $VERSION, so it was not released from main"
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            echo "::notice::$branch already exists"
            exit 0
          fi

          git switch -c "$branch"
          sed -i -E "0,/^version = .*/s//version = \"$dev\"/" pyproject.toml
          sed -i "/^name = \"qilisdk\"$/{n;s/^version = \".*\"$/version = \"$dev\"/}" uv.lock
          grep -qx "version = \"$dev\"" pyproject.toml
          uv lock --check

          bot="${APP_SLUG}[bot]"
          git config user.name "$bot"
          git config user.email "$(gh api "/users/$bot" --jq .id)+$bot@users.noreply.github.com"
          git commit -qam "postrelease $VERSION"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" "$branch"
          gh pr create --base main --head "$branch" \
            --title "[PostRelease] $VERSION" \
            --body "Bumps the development version to $dev after the $VERSION release."
