name: Publish Documentation

on:
  release:
    types: [released]
  workflow_dispatch:

jobs: 
  deploy-documentation: 
    name: Deploying Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          python-version: "3.13"

      - name: Install the requirements
        run: |
          uv sync --frozen --group docs
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install ghp-import
        run: uv pip install --no-build ghp-import==2.1.0

      - name: Build multiversion HTML
        working-directory: docs
        run: make multiversion

      - name: Redirect root to latest release tag
        run: |
          # Only X.Y.Z tags get their own build, so a tag carrying a suffix (e.g. .devN, .postN, rcN) has no directory
          latest_tag=""
          released_tag="${{ github.event.release.tag_name }}"
          if [ -n "$released_tag" ]; then
            release_segment="$(printf '%s' "$released_tag" | sed -E 's/^v?([0-9]+(\.[0-9]+)*).*$/\1/')"
            if [ -d "docs/_build/en/${release_segment}" ]; then
              latest_tag="$release_segment"
            else
              echo "::notice::No built docs for ${released_tag}; keeping the root on the newest built release."
            fi
          fi
          # Otherwise fall back to the newest version that has a build
          # (this is needed for a main tag like 0.2.2rc1, since 0.2.2 doesn't yet exist)
          if [ -z "$latest_tag" ]; then
            latest_tag="$(ls -1 docs/_build/en | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -n 1)"
          fi
          if [ -z "$latest_tag" ]; then
            echo "No built release docs found to redirect to" >&2
            ls docs/_build/en
            exit 1
          fi
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=%s/">' "$latest_tag" > docs/_build/en/index.html
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=%s/">' "en/$latest_tag" > docs/_build/index.html
          mkdir -p docs/_build/main
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=%s/">' "../en/main" > docs/_build/main/index.html
          mkdir -p docs/_build/0.1.8
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=%s/">' "../en/0.1.8" > docs/_build/0.1.8/index.html

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          ghp-import -n -f -p docs/_build/
